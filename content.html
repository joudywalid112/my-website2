<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Analysis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8f0;
      padding: 40px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    table {
      width: 60%;
      margin: 20px auto;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
    }
    th {
      background-color: #f0d9ff;
    }
    .stats {
      width: 60%;
      margin: 30px auto;
      text-align: center;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h2>My Data Table</h2>
  <table>
    <tr>
      <th>Values</th>
    </tr>
    <tr><td>1</td></tr>
    <tr><td>2</td></tr>
    <tr><td>3</td></tr>
    <tr><td>4</td></tr>
    <tr><td>5</td></tr>
  </table>

  <div class="stats">
    <p><strong>Average:</strong> 3</p>
    <p><strong>Maximum:</strong> 5</p>
    <p><strong>Minimum:</strong> 1</p>
  </div>
</body>
</html>
